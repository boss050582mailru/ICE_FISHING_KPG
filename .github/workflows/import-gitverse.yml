name: Import Ice Fishing from GitVerse
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-gitverse.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public GitVerse repository
        run: git clone --depth 1 https://gitverse.ru/Boss05/ICE_FISHING_KPG.git /tmp/ice-fishing-source
      - name: Copy site files
        run: |
          find /tmp/ice-fishing-source -maxdepth 2 -type f | head -30
          cp -a /tmp/ice-fishing-source/. ./
          rm -rf .git
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Ice Fishing site from GitVerse"
          git push
