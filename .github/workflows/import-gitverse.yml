name: Import Ice Fishing from GitVerse
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-gitverse.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download GitVerse source
        run: git clone --depth 1 https://gitverse.ru/Boss05/ICE_FISHING_KPG.git /tmp/ice-fishing-source
      - name: Copy site files without replacing GitHub metadata
        run: |
          tar -C /tmp/ice-fishing-source --exclude=.git -cf - . | tar -xf -
          git status --short
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import Ice Fishing site from GitVerse"
          git push
